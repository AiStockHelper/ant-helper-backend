name: Deploy backend (release → ECR → EC2)

on:
  push:
    branches: ["release"]
  pull_request:
    branches: ["release"]
  workflow_dispatch:

concurrency:
  group: deploy-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  ECR_REPOSITORY: ant-helper-backend

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # BackendApplicationTests(@SpringBootTest)는 MySQL/Redis와 yml 설정이 필요해 CI에서 제외한다.
      - name: Unit tests
        run: ./gradlew test --tests 'com.backend.market.*' --tests 'com.backend.domains.*' --console=plain

  image:
    name: Build & push image (ECR)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository
        if: github.event_name != 'pull_request'
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true >/dev/null
            aws ecr put-lifecycle-policy --repository-name "$ECR_REPOSITORY" --lifecycle-policy-text '{
              "rules":[{"rulePriority":1,"description":"keep last 10 images",
                "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
                "action":{"type":"expire"}}]}' >/dev/null || echo "::warning::could not set ECR lifecycle policy"
          fi

      - name: Build (and push on release)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ github.event_name == 'pull_request' && 'ant-helper-backend:ci' || format('{0}/{1}:{2}', steps.ecr.outputs.registry, env.ECR_REPOSITORY, github.sha) }}
            ${{ github.event_name == 'pull_request' && 'ant-helper-backend:ci-latest' || format('{0}/{1}:latest', steps.ecr.outputs.registry, env.ECR_REPOSITORY) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_KEY: ${{ secrets.EC2_KEY }}
      APPLICATION_COMMON_YML: ${{ secrets.APPLICATION_COMMON_YML }}
      APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_KEY APPLICATION_COMMON_YML APPLICATION_PROD_YML; do
            if [ -z "${!name}" ]; then echo "::error::GitHub secret '$name' is not set"; missing=1; fi
          done
          exit $missing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload runtime config (from secrets)
        run: |
          mkdir -p cfg
          printf '%s\n' "$APPLICATION_COMMON_YML" > cfg/application-common.yml
          printf '%s\n' "$APPLICATION_PROD_YML" > cfg/application-prod.yml
          chmod 600 cfg/*.yml
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'mkdir -p ~/ant-helper/incoming/config'
          scp -i ~/.ssh/ec2_key cfg/*.yml "$EC2_USER@$EC2_HOST:ant-helper/incoming/config/"

      # EC2 에 aws cli/인스턴스 역할이 없어도 되도록, 러너에서 만든 ECR 토큰을 ssh 로 넘겨 docker login 한다.
      - name: Docker login on EC2 (ECR)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "command -v docker >/dev/null || { sudo apt-get update -y && sudo apt-get install -y docker.io curl && sudo systemctl enable --now docker; }; \
             sudo docker login --username AWS --password-stdin $REGISTRY"

      - name: Switch container & health check
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "IMAGE=$IMAGE bash -s" < .github/scripts/remote-deploy.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
